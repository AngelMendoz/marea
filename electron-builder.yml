appId: com.pleamarlabs.marea
productName: Marea
copyright: © 2026 Pleamar Labs
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
# node-pty resuelve su binario nativo desde `prebuilds/<plataforma>-<arch>/`
# (N-API, estable entre versiones de Node/Electron). No hay que recompilar
# desde código fuente: evita necesitar Visual Studio/gcc en la máquina de build.
npmRebuild: false
# Los binarios nativos (.node, .dll, .exe de node-pty) deben quedar FUERA del
# asar para poder cargarse/ejecutarse en tiempo de ejecución.
asarUnpack:
  - '**/node_modules/node-pty/**'
# Nombre de artefacto legible e independiente de la plataforma.
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
win:
  target:
    - target: nsis
      arch:
        - x64
  # Icono: build/icon.ico (electron-builder lo toma solo de buildResources).
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Marea
linux:
  # Iconos en varias dimensiones (16x16 … 1024x1024) para el lanzador y la
  # ventana; sin ellos el ejecutable de Linux no muestra icono.
  icon: assets/icons/linux
  # AppImage: universal (funciona en la mayoría de distribuciones).
  # deb: Ubuntu/Debian y derivados (los más usados).
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  maintainer: Pleamar Labs <angelisaias27112000@gmail.com>
  category: Development
  synopsis: Cliente Git de escritorio con grafo de commits interactivo
  # El .desktop se llama como `desktopName` (package.json): así el escritorio
  # asocia la ventana abierta con su lanzador e icono (app_id en Wayland).
  syncDesktopName: true
deb:
  # Las dependencias por defecto de electron-builder más libasound2: Electron
  # enlaza con ALSA (libasound.so.2) y sin ella la app no arranca en un Ubuntu
  # mínimo o en WSL. En Ubuntu 24.04+ la provee el paquete libasound2t64.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2
